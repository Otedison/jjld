services:
  - type: web
    name: jukwaa-backend
    runtime: node
    rootDir: Backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ALLOW_START_WITHOUT_DB
        value: "false"
      - key: FRONTEND_ORIGIN
        value: https://jjld.netlify.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@jukwaa.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Primary Admin
